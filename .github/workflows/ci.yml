name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. LINTING & SYNTAX VALIDATION
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Code Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Validate Python Syntax & Critical Lints
        run: |
          python -m compileall -q -f game ai api server.py tests
          ruff check game ai api tests --select=E9,F63,F7,F82

      - name: Validate JavaScript Syntax & Structure
        run: |
          npm run lint

  # -------------------------------------------------------------------------
  # 2. UNIT TESTS (PYTHON & NODE.JS)
  # -------------------------------------------------------------------------
  python-unit-tests:
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -s tests/unit -v

  node-unit-tests:
    name: Node.js Unit Tests (v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run JavaScript Unit Tests
        run: |
          npm test

  # -------------------------------------------------------------------------
  # 3. INTEGRATION TESTS (API, CROSS-ENGINE PARITY, GAMEPLAY FLOW)
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [python-unit-tests, node-unit-tests]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js (Required for Parity Tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch

      - name: Run Integration Tests (API, Cross-Engine Parity, Gameplay)
        run: |
          python -m unittest discover -s tests/integration -v
