<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141920"/>
      <stop offset="50%" stop-color="#1b242e"/>
      <stop offset="100%" stop-color="#0f1318"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6832e"/>
      <stop offset="50%" stop-color="#f5d680"/>
      <stop offset="100%" stop-color="#b6832e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ornate Border Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#d4a359" stroke-width="2" opacity="0.4" rx="10"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#d4a359" stroke-width="1" opacity="0.2" rx="6"/>

  <!-- Corner Flourishes -->
  <circle cx="36" cy="36" r="6" fill="#d4a359" opacity="0.7"/>
  <circle cx="1164" cy="36" r="6" fill="#d4a359" opacity="0.7"/>
  <circle cx="36" cy="594" r="6" fill="#d4a359" opacity="0.7"/>
  <circle cx="1164" cy="594" r="6" fill="#d4a359" opacity="0.7"/>

  <!-- Tiger Icon Emblem -->
  <g transform="translate(600, 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="76" fill="#18202a" stroke="#d4a359" stroke-width="3"/>
    <text x="0" y="32" font-size="76" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', sans-serif">🐅</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="310" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="bold" letter-spacing="6" filter="url(#shadow)">
    THE TIGER'S DAY
  </text>

  <!-- Subtitle -->
  <text x="600" y="365" text-anchor="middle" fill="#e8dac1" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" letter-spacing="2">
    The Anglo-Mysore Wars · 1799
  </text>

  <!-- Divider Line -->
  <line x1="420" y1="400" x2="780" y2="400" stroke="#d4a359" stroke-width="2" opacity="0.6"/>
  <polygon points="600,396 605,400 600,404 595,400" fill="#d4a359"/>

  <!-- Description -->
  <text x="600" y="445" text-anchor="middle" fill="#9db0c4" font-family="system-ui, -apple-system, sans-serif" font-size="20" letter-spacing="1">
    Historical Turn-Based Strategy Wargame
  </text>

  <!-- Feature Badges -->
  <g transform="translate(600, 515)">
    <!-- Badge 1 -->
    <rect x="-330" y="-22" width="200" height="44" rx="22" fill="#1e2836" stroke="#d4a359" stroke-width="1.5"/>
    <text x="-230" y="6" text-anchor="middle" fill="#f5d680" font-family="system-ui, sans-serif" font-size="16" font-weight="600">🧠 AlphaZero AI</text>

    <!-- Badge 2 -->
    <rect x="-100" y="-22" width="200" height="44" rx="22" fill="#1e2836" stroke="#d4a359" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#f5d680" font-family="system-ui, sans-serif" font-size="16" font-weight="600">⚔️ Historical Lore</text>

    <!-- Badge 3 -->
    <rect x="130" y="-22" width="200" height="44" rx="22" fill="#1e2836" stroke="#d4a359" stroke-width="1.5"/>
    <text x="230" y="6" text-anchor="middle" fill="#f5d680" font-family="system-ui, sans-serif" font-size="16" font-weight="600">🌐 WebRTC P2P</text>
  </g>
</svg>
